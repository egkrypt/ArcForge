name: ArcForge source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-server.txt
      - run: python -X utf8 tools/verify_release.py
      - run: powershell -NoProfile -File tests/test_launchers.ps1
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node tests/test_chromapper.mjs
      - run: node tests/test_mod_runtime.mjs
      - run: node tests/test_native_preview.mjs
      - run: python -X utf8 tools/package_source.py --audit-only
      - run: python -X utf8 tools/package_source.py
      - run: python -X utf8 tools/verify_release.py --archive release/ArcForge-1.3.0-source.zip --archive-only
